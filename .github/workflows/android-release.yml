name: Publish Mizan Release & Manifest Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish Mizan GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Release Metadata & Files
        id: meta
        run: |
          VERSION_CODE=$(grep -m1 'versionCode =' app/build.gradle.kts | tr -dc '0-9')
          VERSION_NAME=$(grep -m1 'versionName =' app/build.gradle.kts | cut -d'"' -f2)
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="3"; fi
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="2.1.0"; fi
          TAG_NAME="v${VERSION_NAME}-b${VERSION_CODE}"
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

          if [ ! -f "version_manifest.json" ]; then
            cat <<EOF > version_manifest.json
          {
            "appName": "ميزان المالي الذكي",
            "latestVersionCode": ${VERSION_CODE},
            "latestVersionName": "${VERSION_NAME}",
            "apkDownloadUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Mizan-AlHisabat-Latest.apk",
            "releaseNotesAr": "تحديث سحابي تلقائي عبر GitHub Releases (الإصدار v${VERSION_NAME} - Build #${VERSION_CODE}) مع حفظ كامل لجميع المعاملات والبيانات.",
            "isMandatoryUpdate": false
          }
          EOF
          fi

      - name: Publish Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "الإصدار v${{ steps.meta.outputs.version_name }} (Build #${{ steps.meta.outputs.version_code }}) - ميزان المالي"
          body: |
            🚀 **تحديث رسمي لتطبيق ميزان المالي (الإصدار v${{ steps.meta.outputs.version_name }} - Build #${{ steps.meta.outputs.version_code }})**
            - هذا الإصدار مربوط تلقائياً بمركز التحديثات السحابي داخل التطبيق (`peterfayez-lgtm/mizan-alhisabat`).
            - لتحديث ملف الـ APK: يمكنك إرفاق ملف `Mizan-AlHisabat-Latest.apk` المستخرج من AI Studio في هذا الإصدار ليتم تحميله مباشرة على جميع الهواتف مع حفظ البيانات 100%.
            - رابط الفحص التلقائي داخل التطبيق:
              `https://api.github.com/repos/${{ github.repository }}/releases/latest`
          files: |
            version_manifest.json
            releases/*.apk
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
