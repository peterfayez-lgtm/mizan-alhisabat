name: Build APK & Publish GitHub Release Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Mizan APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Prepare Environment (.env, Keystore, and SDK Licenses)
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Release Artifacts & Manifest JSON
        id: meta
        run: |
          VERSION_CODE=$(grep -m1 'versionCode =' app/build.gradle.kts | tr -dc '0-9')
          VERSION_NAME=$(grep -m1 'versionName =' app/build.gradle.kts | cut -d'"' -f2)
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="3"; fi
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="2.1.0"; fi
          TAG_NAME="v${VERSION_NAME}-b${VERSION_CODE}"
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

          cp app/build/outputs/apk/debug/app-debug.apk Mizan-AlHisabat-Latest.apk

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/Mizan-AlHisabat-Latest.apk"
          cat <<EOF > version_manifest.json
          {
            "appName": "ميزان المالي الذكي",
            "latestVersionCode": ${VERSION_CODE},
            "latestVersionName": "${VERSION_NAME}",
            "apkDownloadUrl": "${DOWNLOAD_URL}",
            "releaseNotesAr": "تحديث سحابي تلقائي عبر GitHub Releases (الإصدار v${VERSION_NAME} - Build #${VERSION_CODE}) مع حفظ كامل لجميع المعاملات والبيانات.",
            "isMandatoryUpdate": false
          }
          EOF

      - name: Publish Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "الإصدار v${{ steps.meta.outputs.version_name }} (Build #${{ steps.meta.outputs.version_code }}) - ميزان المالي"
          body: |
            🚀 **تحديث تلقائي لتطبيق ميزان المالي (الإصدار v${{ steps.meta.outputs.version_name }} - Build #${{ steps.meta.outputs.version_code }})**
            - قم بتحميل ملف `Mizan-AlHisabat-Latest.apk` بالأسفل وتثبيته مباشرة فوق النسخة الحالية مع حفظ جميع البيانات 100%.
            - رابط الفحص التلقائي داخل التطبيق (GitHub Releases API):
              `https://api.github.com/repos/${{ github.repository }}/releases/latest`
          files: |
            Mizan-AlHisabat-Latest.apk
            version_manifest.json
          draft: false
          prerelease: false
          make_latest: true
